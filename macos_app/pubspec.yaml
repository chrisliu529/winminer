name: winminer_app
description: Winminer Minesweeper bot for iOS, macOS, and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/victory.wav
    - assets/audio/reveal_effect.wav
    - assets/audio/flag_effect.wav
    - assets/audio/mine_effect.wav
